<!DOCTYPE html>

<meta charset="UTF-8">
<title>Prowl — Sonar Cat Icon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D0E18;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 56px 48px;
    color: #F0EDE8;
  }

  .eyebrow { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: #555670; margin-bottom: 10px; }
  h1 { font-size: 32px; font-weight: 700; margin-bottom: 56px; }

  /* ── Size showcase ─────────────────────────── */
  .sizes-row { display: flex; align-items: flex-end; gap: 40px; margin-bottom: 64px; }
  .size-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .size-label { font-size: 11px; letter-spacing: 2px; color: #555670; }

  /* ── Variants row ──────────────────────────── */
  .variants-label {
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #555670; margin-bottom: 24px;
  }
  .variants-row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-bottom: 64px; }

  /* ── Wordmark section ──────────────────────── */
  .wordmark-row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; padding-top: 48px; border-top: 1px solid #2A2C3D; }

  /* ── Simulated home screens ────────────────── */
  .homescreen-section { margin-top: 64px; }
  .homescreen-label { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #555670; margin-bottom: 24px; }
  .homescreen-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .homescreen {
    border-radius: 20px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .homescreen-title { font-size: 11px; color: #9B9AAD; margin-bottom: 12px; }
  .app-icon-label { font-size: 10px; color: rgba(255,255,255,0.6); text-align: center; margin-top: 4px; }
</style>

      <!-- right eye -->

      <!-- nose -->
